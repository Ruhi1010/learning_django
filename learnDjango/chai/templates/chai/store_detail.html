
{% extends "layout.html" %}

{% block title %}
Store Detail
{% endblock title %}

{% block content %}

<div class="min-h-screen pt-16">

    <div class="text-center mb-10">
        <h1 class="text-3xl font-bold">
            Ruhi Practice Hub | Store
        </h1>

        <h2 class="text-2xl font-semibold mt-4">
            All Stores
        </h2>
    </div>

    <div class="flex flex-col items-center">

        {% for store in stores %}

        <div class="w-full max-w-2xl mb-6">
            <div class="bg-blue-600 p-6 rounded-xl shadow-lg">

                <h2 class="text-2xl font-bold text-white mb-2">
                    {{ store.name }}
                </h2>

                <h3 class="text-lg text-white mb-2">
                    {{ store.location }}
                </h3>

                <p class="text-md text-white">
                    {{ store.description }}
                </p>

            </div>

           
<a href="{% url 'store_reviews' store.id %}"
   class="inline-block border border-gray-300 bg-white text-gray-800 hover:bg-gray-100 font-semibold text-sm py-2 px-5 rounded-lg shadow-md transition-all duration-200">
    View Reviews →
</a>


            
        </div>

        {% endfor %}

    </div>

</div>

{% endblock content %}
```
